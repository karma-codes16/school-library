<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial;
            background: linear-gradient(135deg,#002147, #00897B);
            overflow-x: hidden;
        }

        /* NAVIGATION BAR */
        nav {
            background: #ff6f61;
            padding: 20px;
            text-align: center;
            font-size: 28px;
            color: white;
            font-weight: bold;
            letter-spacing: 2px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
        }

        /* FLOATING DECORATION SHAPES */
        .shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.3;
            animation: float 6s ease-in-out infinite;
        }
        .shape1 {
            width: 180px; height: 180px;
            background: #ffe0d2;
            top: 10%; left: 5%;
        }
        .shape2 {
            width: 120px; height: 120px;
            background: #ffd5c2;
            bottom: 15%; right: 10%;
            animation-delay: 1s;
        }
        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-25px); }
            100% { transform: translateY(0); }
        }

        /* STATS SECTION */
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
            min-width: 150px;
            border: 3px solid #ffb6a1;
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #ff6f61;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            color: #666;
            font-weight: 600;
        }

        /* MAIN PAGE CENTER */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 60vh;
            flex-wrap: wrap;
            gap: 45px;
            position: relative;
            z-index: 2;
            padding: 20px;
        }

        /* CIRCLE BUTTONS */
        .circle {
            width: 170px;
            height: 170px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #ff6f61;
            cursor: pointer;
            transition: 0.35s;
            border: 4px solid #ffb6a1;
            text-decoration: none;
        }

        .circle:hover {
            transform: scale(1.12) rotate(3deg);
            background: #ffe6df;
            border-color: #ff8b74;
            box-shadow: 0 10px 30px rgba(0,0,0,0.32);
        }

        /* FOOTER */
        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 12px;
            font-size: 18px;
            letter-spacing: 1px;
            margin-top: 40px;
        }

        /* Loading indicator */
        .loading {
            color: #666;
            font-style: italic;
        }

        .top-nav {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center; /* keeps title centered */
  background: var(--accent);
  color: white;
  padding: 18px;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 1px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.18);
}

.logo {
  position: absolute;
  left: 16px;
  height: 40px;      /* adjust as you like */
  width: auto;
  object-fit: contain;
}

.nav-title {
  pointer-events: none;
}

    </style>
</head>
<body>

    <div class="shape shape1"></div>
    <div class="shape shape2"></div>

<nav class="top-nav">
    <img src="logo.png" alt="Library Logo" class="logo">
    <span class="nav-title">Admin Management</span>
</nav>


    <!-- Dashboard Stats -->
    <div class="stats">
        <div class="stat-card">
            <div class="stat-number" id="totalBooks">-</div>
            <div class="stat-label">Total Books</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="totalBorrowers">-</div>
            <div class="stat-label">Registered Users</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="activeBorrows">-</div>
            <div class="stat-label">Books Borrowed</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="pendingReports">-</div>
            <div class="stat-label">Pending Reports</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="unpaidFines">-</div>
            <div class="stat-label">Unpaid Fines</div>
        </div>
    </div>

    <div class="container">
        <a href="books_data.html" class="circle">Books Data</a>
        <a href="fines.html" class="circle">Fines</a>
        <a href="reports_management.html" class="circle">Manage Reports</a>
    </div>

    <footer>Created by Arpan and Karma</footer>

    <script>
        // Load dashboard statistics
        async function loadDashboardStats() {
            try {
                const response = await fetch('/api/dashboard');
                const data = await response.json();
                
                document.getElementById('totalBooks').textContent = data.totalBooks;
                document.getElementById('totalBorrowers').textContent = data.totalBorrowers;
                document.getElementById('activeBorrows').textContent = data.activeBorrows;
                document.getElementById('pendingReports').textContent = data.pendingReports;
                document.getElementById('unpaidFines').textContent = data.unpaidFines;
            } catch (error) {
                console.error('Error loading dashboard stats:', error);
                // Show loading state if API fails
                document.querySelectorAll('.stat-number').forEach(el => {
                    el.textContent = '?';
                    el.classList.add('loading');
                });
            }
        }

        // Load stats when page loads
        document.addEventListener('DOMContentLoaded', loadDashboardStats);
    </script>

</body>
</html>
