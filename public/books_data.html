<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books & Borrow Data</title>
    <style>
        :root {
            --bg1: #ffecd2;
            --bg2: #fcb69f;
            --accent: #ff6f61;
            --soft: #ffe6df;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #002147, #00897B);
        }

        nav {
            background: var(--accent);
            color: white;
            padding: 18px;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.18);
        }

        .back-btn {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        h1 {
            text-align: center;
            color: var(--accent);
            margin-top: 30px;
            font-size: 36px;
            font-weight: 700;
        }

        /* Search Section */
        .search-section {
            text-align: center;
            margin: 20px auto;
            max-width: 500px;
        }

        .search-box {
            width: 100%;
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            outline: none;
        }

        /* Two-column layout */
        .main-container {
            display: flex;
            justify-content: space-between;
            width: 95%;
            margin: 30px auto;
            gap: 20px;
            flex-wrap: wrap;
        }

        .section-box {
            width: 48%;
            min-width: 300px;
            background: var(--soft);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }
            .section-box {
                width: 100%;
            }
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: white;
            border-radius: 15px;
            overflow: hidden;
        }

        th {
            background: var(--accent);
            color: white;
            padding: 12px;
            text-align: left;
            font-size: 16px;
        }

        td {
            padding: 12px;
            font-size: 14px;
            border-bottom: 1px solid #f0f0f0;
        }

        tr:nth-child(even) {
            background: #ffe1d7;
        }

        tr:hover {
            background: #ffd0c3;
            transition: 0.3s;
        }

        .loading {
            text-align: center;
            color: #666;
            font-style: italic;
            padding: 20px;
        }

        .error {
            text-align: center;
            color: #c0392b;
            padding: 20px;
            background: #ffeaea;
            border-radius: 10px;
            margin: 10px 0;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-borrowed {
            background: #ff6f61;
            color: white;
        }

        .status-returned {
            background: #2ecc71;
            color: white;
        }

        .status-overdue {
            background: #e74c3c;
            color: white;
        }

        .availability {
            font-weight: bold;
        }

        .available {
            color: #27ae60;
        }

        .unavailable {
            color: #e74c3c;
        }

        .btn-delete {
  background: #e74c3c;
  color: #fff;
  border: none;
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
}
.btn-delete:hover {
  background: #c0392b;
}
.top-nav {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center; /* keeps title centered */
  background: var(--accent);
  color: white;
  padding: 18px;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 1px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.18);
}

.logo {
  position: absolute;
  left: 16px;
  height: 40px;      /* adjust as you like */
  width: auto;
  object-fit: contain;
}

.nav-title {
  pointer-events: none;
}


    </style>
</head>
<body>

<nav class="top-nav">
    <img src="logo.png" alt="Library Logo" class="logo">
    <span class="nav-title">Library Data</span>
</nav>


    <div class="search-section">
        <input type="text" class="search-box" id="searchBox" placeholder="Search books by title, author, or ISBN...">
    </div>

    <div class="main-container">

        <!-- LEFT SECTION → BOOKS DATA -->
        <div class="section-box">
            <h2 style="color:var(--accent); text-align:center;">Books Inventory</h2>

            <div id="booksLoading" class="loading">Loading books...</div>
            <div id="booksError" class="error" style="display: none;"></div>

            <table id="booksTable" style="display: none;">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Category</th>
                        <th>Available/Total</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Data loaded from backend -->
                </tbody>
            </table>
        </div>

        <!-- RIGHT SECTION → TRANSACTION DATA -->
        <div class="section-box">
            <h2 style="color:var(--accent); text-align:center;">Recent Transactions</h2>

            <div id="transactionsLoading" class="loading">Loading transactions...</div>
            <div id="transactionsError" class="error" style="display: none;"></div>

            <table id="transactionsTable" style="display: none;">
                <thead>
                    <tr>
                        <th>Book</th>
                        <th>Borrower</th>
                        <th>Date</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Data loaded from backend -->
                </tbody>
            </table>
        </div>

    </div>

    <script>
        let allBooks = [];
        let allTransactions = [];

        // Load books data
        async function loadBooks() {
            try {
                const response = await fetch('/api/books');
                if (!response.ok) throw new Error('Failed to fetch books');
                
                allBooks = await response.json();
                displayBooks(allBooks);
                
                document.getElementById('booksLoading').style.display = 'none';
                document.getElementById('booksTable').style.display = 'table';
            } catch (error) {
                console.error('Error loading books:', error);
                document.getElementById('booksLoading').style.display = 'none';
                document.getElementById('booksError').style.display = 'block';
                document.getElementById('booksError').textContent = 'Failed to load books. Please check if the server is running.';
            }
        }

        // Display books in table
        function displayBooks(books) {
            const tbody = document.querySelector("#booksTable tbody");
            tbody.innerHTML = '';
            
            books.forEach(book => {
                const availability = book.available_copies > 0 ? 'available' : 'unavailable';
                const row = `
                    <tr>
                        <td>${book.id}</td>
                        <td>${book.title}</td>
                        <td>${book.author}</td>
                        <td>${book.category || 'N/A'}</td>
                        <td class="availability ${availability}">
                            ${book.available_copies}/${book.total_copies}
                        </td>
                        <td><button class="btn-delete" data-id="${book.id}">Delete</button></td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        // Load transactions data
        async function loadTransactions() {
            try {
                const response = await fetch('/api/transactions');
                if (!response.ok) throw new Error('Failed to fetch transactions');
                
                allTransactions = await response.json();
                displayTransactions(allTransactions.slice(0, 10)); // Show latest 10
                
                document.getElementById('transactionsLoading').style.display = 'none';
                document.getElementById('transactionsTable').style.display = 'table';
            } catch (error) {
                console.error('Error loading transactions:', error);
                document.getElementById('transactionsLoading').style.display = 'none';
                document.getElementById('transactionsError').style.display = 'block';
                document.getElementById('transactionsError').textContent = 'Failed to load transactions.';
            }
        }

        // Display transactions in table
        function displayTransactions(transactions) {
            const tbody = document.querySelector("#transactionsTable tbody");
            tbody.innerHTML = '';
            
            transactions.forEach(transaction => {
                const date = new Date(transaction.borrow_date).toLocaleDateString();
                const statusClass = `status-${transaction.status}`;
                
                const row = `
                    <tr>
                        <td>${transaction.book_title}</td>
                        <td>${transaction.borrower_name}</td>
                        <td>${date}</td>
                        <td><span class="status-badge ${statusClass}">${transaction.status}</span></td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        // Search functionality
        function setupSearch() {
            const searchBox = document.getElementById('searchBox');
            searchBox.addEventListener('input', (e) => {
                const searchTerm = e.target.value.toLowerCase();
                
                if (searchTerm === '') {
                    displayBooks(allBooks);
                } else {
                    const filteredBooks = allBooks.filter(book => 
                        book.title.toLowerCase().includes(searchTerm) ||
                        book.author.toLowerCase().includes(searchTerm) ||
                        book.isbn.toLowerCase().includes(searchTerm) ||
                        (book.category && book.category.toLowerCase().includes(searchTerm))
                    );
                    displayBooks(filteredBooks);
                }
            });
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', () => {
            loadBooks();
            loadTransactions();
            setupSearch();
        });

        document.addEventListener('click', async (e) => {
  if (e.target.classList.contains('btn-delete')) {
    const id = e.target.getAttribute('data-id');
    if (!confirm('Are you sure you want to delete this book?')) return;

    try {
      const res = await fetch(`/api/books/${id}`, { method: 'DELETE' });
      const data = await res.json();

      if (!res.ok) {
        alert(data.error || 'Failed to delete book');
        return;
      }

      // Remove row from UI
      e.target.closest('tr').remove();

      // Also update allBooks array so search stays in sync
      allBooks = allBooks.filter(b => b.id !== Number(id));
    } catch (err) {
      console.error('Delete error:', err);
      alert('Server error while deleting book');
    }
  }
});

    </script>

</body>
</html>
